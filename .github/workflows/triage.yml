name: Triage

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      number:
        description: Issue number to preview without changing labels or posting comments
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: triage-issue-${{ inputs.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    if: github.event.sender.type != 'Bot' && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: crmne/copilot-triage@2c1636ec994f3d1e07650d1dcc4f9245d9fbe2be # v0.6.2
        with:
          copilot-token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          # Pin a lightweight model; auto cannot accept the action's reasoning setting.
          model: gpt-5-mini
          kind: issue
          number: ${{ inputs.number || github.event.issue.number }}
          # Manual runs preview a decision in the job summary; they still use Copilot credits.
          dry-run: ${{ github.event_name == 'workflow_dispatch' }}
