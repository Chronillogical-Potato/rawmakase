name: Triage

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      number:
        description: Issue number to preview without changing labels or posting comments
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: triage-issue-${{ inputs.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    if: github.event.sender.type != 'Bot' && !github.event.issue.pull_request
    # Persist muted threads and prior replies on issue and comment events.
    cache-mode: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: crmne/copilot-triage@f99b390350c35f44f1cca240c9b25c08eb9ad4db # v0.18.0
        with:
          copilot-token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          # Copilot Free supports automatic model selection only.
          model: auto
          reasoning-effort: default
          kind: issue
          number: ${{ inputs.number || github.event.issue.number }}
          # Manual runs preview a decision in the job summary; they still use Copilot credits.
          dry-run: ${{ github.event_name == 'workflow_dispatch' }}
