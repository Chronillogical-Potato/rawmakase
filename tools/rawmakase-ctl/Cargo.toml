[package]
name = "rawmakase-ctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Command-line control of a running RAWmakase: the Loupedeck's dials and buttons, from a script"
license = "MIT"

[dependencies]
rawmakase-protocol = { path = "../../crates/rawmakase-protocol", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
