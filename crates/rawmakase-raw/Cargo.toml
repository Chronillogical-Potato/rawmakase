[package]
name = "rawmakase-raw"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "RAWmakase's own RAW decoders in pure Rust: containers, maker notes, sensor codecs, camera facts and embedded previews"
license = "MIT"
publish = false

[features]
# Synthetic codestreams, for other crates' tests.
test-support = []

[dependencies]
rawmakase-tiff = { path = "../rawmakase-tiff", version = "0.1.0" }
# Deflate-compressed DNG tiles.
miniz_oxide = "0.9"
# JPEG XL-compressed DNG tiles (DNG 1.7).
jxl-oxide = { version = "0.12.6", default-features = false }
rayon = "1.12"
# The camera fact tables (data/raw-cameras.toml, raw-matrices.toml), parsed
# once.
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
