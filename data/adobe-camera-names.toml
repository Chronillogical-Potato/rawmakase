# Names Adobe's camera profiles (DCP UniqueCameraModel) use for cameras that LibRaw
# names otherwise, where neither LibRaw's canonical name (normalized_model, which
# already maps regional twins such as the Panasonic DC-G95 to the DC-G99) nor
# comparing names without spaces and underscores (Nikon "Z 6_2" and "Z 6 2") finds
# them. Read by rawmakase-model's cameras::adobe_names. See docs/cameras.md.
#
# Each name is the camera name inside the Adobe Standard profile Camera Raw 18.7
# installs. The Samsung entry was also checked against Camera Raw's render of a
# raw.pixls.us photo (ΔE00 0.5 at the default settings); see #448.

[[make]]
libraw = "OM Digital"
adobe = "OM Digital Solutions"

[[camera]]
make = "Olympus"
model = "E-M10MarkIIIS"
adobe = "Olympus E-M10 Mark III"
why = "the Mark III S is a Mark III with other menus; Adobe profiles it as one"

# Camera Raw 18.7 installs no profiles for these G99 twins and lists them, with the
# G90, G91 and G95, among the bodies it profiles under another camera's name; the
# G95D's and G97's colour matrices (data/raw-matrices.toml) are the G95's. #664 was a
# G97 offered no Adobe profiles. The G97 entry was checked against Camera Raw's
# render of a raw.pixls.us photo (median ΔE00 1.7 with the G99's Adobe Standard,
# 3.5 with RAWmakase Color); there was no photo from the other three to check.
[[camera]]
make = "Panasonic"
model = "DC-G97"
adobe = "Panasonic DC-G99"
why = "the Lumix G97 has the G99's sensor; Adobe profiles it as one"

[[camera]]
make = "Panasonic"
model = "DC-G95D"
adobe = "Panasonic DC-G99"
why = "the Lumix G95D is a G95 (a G99 twin) in other kits; Adobe profiles it as a G99"

[[camera]]
make = "Panasonic"
model = "DC-G99D"
adobe = "Panasonic DC-G99"
why = "the Lumix G99D is a G99 in other kits; Adobe profiles it as one"

[[camera]]
make = "Panasonic"
model = "DC-G99M2"
adobe = "Panasonic DC-G99"
why = "the Lumix G99 II is the G97 sold in Japan; Adobe profiles it as a G99"

[[camera]]
make = "Samsung"
model = "SM-G965F"
adobe = "Samsung Galaxy S9+"
why = "Samsung's model code for the Galaxy S9+"

[[camera]]
make = "Huawei"
model = "VOG-L29"
adobe = "HUAWEI P30 Pro"
why = "Huawei's model code for the P30 Pro; Adobe profiles each camera module"
