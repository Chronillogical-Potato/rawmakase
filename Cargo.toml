[package]
name = "rawmakase"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A fast, non-destructive RAW photo developer"
license = "MIT"
repository = "https://github.com/pch/rawmakase"

[dependencies]
anyhow = "1"
flate2 = "1"
roxmltree = "0.21.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rayon = "1.12"
bytemuck = "1.25"
pollster = "1"
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff"] }
tiff = "0.11.3"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
eframe = { version = "=0.36.1", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
rfd = "0.17.2"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[profile.release]
lto = "thin"

[profile.dev]
opt-level = 1
