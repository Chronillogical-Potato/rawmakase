[package]
name = "rawmakase-ctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Command-line control of a running RAWmakase: the Loupedeck's dials and buttons, from a script"
license = "MIT"

# Not part of RAWmakase's own build, and not a member of any workspace, so
# upstream's Cargo.toml and Cargo.lock never see it.
[workspace]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
