# RAWmakase's camera table: per-model values that are not in the raw file itself.
# See docs/cameras.md for what each field means and how to add a camera.
#
# make and model are the names LibRaw reports (raw-identify -v prints them as
# "Normalized Make/Model"); aliases are other model names for the same body.
# baseline_exposure is the exposure, in EV, Camera Raw adds to an unedited photo
# with Adobe Standard. source says where the value comes from:
#   adobe-dng      read from a DNG Adobe software wrote (BaselineExposure tag)
#   adobe-profile  read from the camera's Adobe DCP (BaselineExposureOffset tag)
#   fitted         fitted to Camera Raw renders (median midtone offset)
#   measured       measured by hand; say how in `how`
# checked is the date of the check and sample what it was checked on.
# Fujifilm values hold for DR100 only.

[[camera]]
make = "Canon"
model = "EOS 90D"
baseline_exposure = 0.45
source = "fitted"
checked = "2026-10-05"
sample = "raw.pixls.us, 1 photo"

