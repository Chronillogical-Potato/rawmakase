name: rawmakase
arch: amd64
platform: linux
version: ${VERSION}
maintainer: pch <https://github.com/pch>
description: A fast, non-destructive RAW photo developer
homepage: https://github.com/pch/rawmakase
license: MIT
contents:
  - src: dist/linux-root/usr/bin/rawmakase
    dst: /usr/bin/rawmakase
  - src: dist/linux-root/usr/lib/rawmakase/
    dst: /usr/lib/rawmakase/
    type: tree
  - src: dist/linux-root/usr/share/
    dst: /usr/share/
    type: tree
overrides:
  deb:
    depends:
      - libc6 (>= 2.39)
      - libstdc++6 (>= 14)
      - libgcc-s1
      - libgomp1
      - zlib1g
      - libvulkan1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libx11-6
      - libx11-xcb1
      - libxcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - libegl1
      - libgl1
    recommends:
      - xdg-desktop-portal
  rpm:
    depends:
      - glibc >= 2.39
      - libstdc++ >= 14
      - libgcc
      - libgomp
      - zlib
      - vulkan-loader
      - libxkbcommon
      - libxkbcommon-x11
      - libwayland-client
      - libwayland-cursor
      - libwayland-egl
      - libX11
      - libxcb
      - libXcursor
      - libXi
      - libXrandr
      - libglvnd-egl
      - libglvnd-glx
    recommends:
      - xdg-desktop-portal
